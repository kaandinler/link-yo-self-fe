name: Lint and Format Check

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      # --ext ESLint 9 flat config'de kaldirildi; kullanildiginda
      # "Unknown options: extensions" hatasiyla adim basarisiz oluyordu.
      # Hangi uzantilarin taranacagi artik eslint.config.mjs'te tanimli.
      - name: Run ESLint
        run: npx eslint .

      - name: Run Prettier check
        run: npx prettier . --check
