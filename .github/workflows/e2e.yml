name: E2E tests

on: [push, pull_request]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    # Testler gercek backend'e karsi kosuyor; sahte sunucu yok.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linkyoself
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/linkyoself
      SECRET_KEY: e2e-only-secret-key
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_IS_SIGN_UP_ENABLED: "true"
      # SMTP yapilandirilmadigi icin backend e-postalari log'a yaziyor;
      # dogrulama ve sifre sifirlama testleri token'i buradan okuyor.
      E2E_BACKEND_LOG: /tmp/linkyoself-backend.log

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      # Backend ayni urunun diger yarisi ve herkese acik bir repo;
      # token gerekmiyor.
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: kaandinler/link-yo-self-be
          ref: dev
          path: backend

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Start backend
        working-directory: backend
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 \
            > "$E2E_BACKEND_LOG" 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/ > /dev/null; then
              echo "backend hazir"
              exit 0
            fi
            sleep 2
          done
          echo "backend 60 saniyede ayaga kalkmadi:"
          cat "$E2E_BACKEND_LOG"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # playwright.config.ts webServer'i CI'da "npm run build:e2e && npm run start"
      # calistiriyor; Next uygulamasini ayrica baslatmaya gerek yok.
      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Bir test e-posta token'i bulamadiginda ilk bakilacak yer backend log'u.
      - name: Upload backend log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-log
          path: /tmp/linkyoself-backend.log
          retention-days: 7
