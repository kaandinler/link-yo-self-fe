name: E2E tests

# push'ta yalnizca dev ve main: bir dalda acik PR varken hem push hem
# pull_request tetikleniyordu ve ayni commit icin butun suite iki kez
# kosuyordu (ornegin 6281d1b icin 87 ve 88 numarali calismalar; dev'e
# merge'de uc kez). Dal calismalari artik PR uzerinden geliyor.
on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  # Art arda push yapildiginda yalnizca son commit'in sonucu onemli;
  # eskisini iptal etmek hem runner'i hem sirayi bosaltiyor. dev ve
  # main'de iptal yok: oradaki her commit'in kendi kaydi kalsin.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    # Testler gercek backend'e karsi kosuyor; sahte sunucu yok.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: linkyoself
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/linkyoself
      SECRET_KEY: e2e-only-secret-key
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_IS_SIGN_UP_ENABLED: "true"
      # Backend'in hiz siniri BU SUITTE KAPALI.
      #
      # NEDEN: suitteki testlerin cogu kendine yeni bir kullanici
      # kaydediyor ve hepsi runner'in tek IP'sinden geliyor. Backend
      # kayit icin saatte 5 sinirliyor, yani altinci testten itibaren
      # her sey 429 aliyor. Olculdu: bu satir olmadan turkish.spec'in
      # 6 testi "kayit basarisiz: Too many requests" ile dusuyor.
      #
      # Siniri GEVSETMEK yanlis cozum olurdu: gercek korumayi bir test
      # kolayligi icin zayiflatmak demekti. Anahtar zaten tam bu is
      # icin var (bkz. backend settings.rate_limit_enabled).
      #
      # SINIRIN KENDISI BACKEND SUITINDE, ANAHTAR ACIKKEN test ediliyor
      # (tests/test_rate_limit.py, 19 test) -- yani burada kapatmak
      # kapsamda bir bosluk birakmiyor.
      RATE_LIMIT_ENABLED: "false"
      # SMTP yapilandirilmadigi icin backend e-postalari log'a yaziyor;
      # dogrulama ve sifre sifirlama testleri token'i buradan okuyor.
      E2E_BACKEND_LOG: /tmp/linkyoself-backend.log
      BUILD_LOG: /tmp/frontend-build.log
      BUILD_STATUS: /tmp/frontend-build.status
      # Admin paneli yalnizca admin'e aciliyor ve kayit ucu bilincli
      # olarak admin acmiyor (herkes kendini admin yapardi). Panelin
      # testlerinin bir admine ihtiyaci var; backend'in kendi betigi
      # bos veritabaninda ilkini aciyor.
      E2E_ADMIN_USERNAME: e2eadmin
      E2E_ADMIN_EMAIL: e2eadmin@example.com
      E2E_ADMIN_PASSWORD: E2eAdmin.Parola1

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v7

      # Backend ayni urunun diger yarisi ve herkese acik bir repo;
      # token gerekmiyor.
      - name: Checkout backend
        uses: actions/checkout@v7
        with:
          repository: kaandinler/link-yo-self-be
          ref: dev
          path: backend

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ARKA PLANDA: derleme ~35 saniye suruyor ve hicbir sey beklemiyor.
      # Onu simdi baslatip backend kurulumu ile tarayici indirmeyi ayni
      # anda kosturmak, seri dizilimin ustune ekledigi ~30 saniyeyi
      # geri veriyor. Cikis kodu bir dosyaya yaziliyor; "Wait" adimi onu
      # okuyor, yani derleme hatasi sessizce gecmiyor.
      - name: Start frontend build
        run: |
          rm -f "$BUILD_STATUS" "$BUILD_STATUS.tmp"
          # Cikis kodu once gecici dosyaya yazilip mv ile yerine konuyor.
          # Dogrudan yazilsaydi yonlendirme dosyayi echo'dan once
          # olusturur ve bekleyen adim onu bos okuyabilirdi.
          nohup bash -c \
            'npm run build:e2e > "$BUILD_LOG" 2>&1
             echo $? > "$BUILD_STATUS.tmp"
             mv "$BUILD_STATUS.tmp" "$BUILD_STATUS"' \
            > /dev/null 2>&1 &

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      # Migration'dan SONRA: tablolar olmadan calisamaz. Backend'ten
      # once olmasi sart degil ama burada durmasi kurulum adimlarini
      # bir arada tutuyor.
      - name: Seed admin user
        working-directory: backend
        run: |
          ADMIN_USERNAME="$E2E_ADMIN_USERNAME" \
          ADMIN_EMAIL="$E2E_ADMIN_EMAIL" \
          ADMIN_PASSWORD="$E2E_ADMIN_PASSWORD" \
            python -m scripts.create_admin

      - name: Start backend
        working-directory: backend
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 \
            > "$E2E_BACKEND_LOG" 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/ > /dev/null; then
              echo "backend hazir"
              exit 0
            fi
            sleep 2
          done
          echo "backend 60 saniyede ayaga kalkmadi:"
          cat "$E2E_BACKEND_LOG"
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for frontend build
        run: |
          for i in $(seq 1 240); do
            if [ -s "$BUILD_STATUS" ]; then
              cat "$BUILD_LOG"
              exit "$(cat "$BUILD_STATUS")"
            fi
            sleep 1
          done
          echo "derleme 240 saniyede bitmedi:"
          cat "$BUILD_LOG"
          exit 1

      # Derleme yukarida bitti; playwright.config.ts webServer'i CI'da
      # yalnizca "npm run start" calistiriyor.
      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Bir test e-posta token'i bulamadiginda ilk bakilacak yer backend log'u.
      - name: Upload backend log
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: backend-log
          path: /tmp/linkyoself-backend.log
          retention-days: 7
